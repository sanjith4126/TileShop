{% extends "base.html" %}

{% block content %}
<main class="pt-32 pb-24 px-6 min-h-screen">
  <article class="max-w-3xl mx-auto">
    {% if preview %}
    <p class="mb-8 p-4 bg-secondary-container text-on-secondary-container font-label text-[11px] tracking-widest uppercase" role="note">
      Draft preview — only staff can see this page until it is published.
    </p>
    {% endif %}
    <header class="mb-12">
      <span class="font-label text-[10px] tracking-[0.2em] text-secondary uppercase block mb-2">{{ site_name }}</span>
      <h1 class="text-4xl md:text-5xl font-headline font-bold text-primary leading-tight">{{ page.title }}</h1>
      <p class="font-label text-[10px] tracking-widest text-on-surface-variant uppercase mt-6">Last updated {{ page.updated_at|date:"j M Y" }}</p>
    </header>
    <div class="guide-body font-body text-on-surface-variant leading-relaxed space-y-6">
      {{ page.body|safe }}
    </div>
  </article>
</main>
{% endblock %}
